name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm audit --audit-level=high
        working-directory: app

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - name: Apply D1 migrations to an isolated local database
        run: npx wrangler d1 migrations apply productivity-db --local
        working-directory: worker
      - name: Verify migrated task schema
        run: npx wrangler d1 execute productivity-db --local --command "SELECT id, title, status FROM tasks LIMIT 1"
        working-directory: worker
      - name: Validate Worker bundle and configuration
        run: npx wrangler deploy --dry-run --outdir /tmp/eris-worker-dist
        working-directory: worker
      - run: npm audit --audit-level=high
        working-directory: worker

  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed lines for whitespace errors
        run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }} ${{ github.sha }}
