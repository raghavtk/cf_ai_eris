name = "productivity-assistant-worker"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 10 * * *"]

[ai]
binding = "AI"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "productivity-db"
database_id = "3bfde29c-eff5-4a2c-9f7e-544c78849f4e"
migrations_dir = "db/migrations"
preview_database_id = "3bfde29c-eff5-4a2c-9f7e-544c78849f4e"

[[durable_objects.bindings]]
name = "COMMAND_PARSER"
class_name = "CommandParserDO"

[[migrations]]
tag = "v1-sqlite"
new_sqlite_classes = ["CommandParserDO"]

# Every production route fails closed unless Cloudflare Access and these values
# are configured. Keep the email and exact public frontend origin deployment-specific.
# [vars]
# ERIS_ALLOWED_EMAIL = "you@example.com"
# ERIS_ALLOWED_ORIGIN = "https://eris.example.com"
# TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
# POLICY_AUD = "your-access-application-audience-tag"
# Set ERIS_LOCAL_DEV=true only in worker/.dev.vars. The Worker also requires a
# loopback hostname, and production must never define this variable.
# GitHub connector secrets: GITHUB_APP_ID, GITHUB_APP_SLUG, GITHUB_CLIENT_ID,
# GITHUB_CLIENT_SECRET, GITHUB_PRIVATE_KEY, GITHUB_TOKEN_ENCRYPTION_KEY.

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
